name: main
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # needed to push commits below

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: set git config
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - run: uv run --no-project mirror.py

      - name: check for unpushed commits
        id: check_unpushed
        run: |
          UNPUSHED_COMMITS=$(git log origin/main..HEAD)
          if [ -z "$UNPUSHED_COMMITS" ]; then
            echo "No unpushed commits found."
            echo "changes_exist=false" >> "$GITHUB_ENV"
          else
            echo "Unpushed commits found."
            echo "changes_exist=true" >> "$GITHUB_ENV"
            {
              echo "tags<<EOF"
              git rev-list --reverse origin/main..HEAD |
                while IFS= read -r commit; do
                  git tag --points-at "$commit"
                done
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: push changes if they exist
        if: env.changes_exist == 'true'
        run: |
          git push origin HEAD:refs/heads/main
          git push origin HEAD:refs/heads/main --tags

      - name: create releases for new tags
        if: env.changes_exist == 'true'
        run: |
          latest_tag=$(printf '%s\n' "$NEW_TAGS" | tail -n 1)

          while IFS= read -r tag_name; do
            if [ -z "$tag_name" ]; then
              continue
            fi

            latest_flag="--latest=false"
            if [ "$tag_name" = "$latest_tag" ]; then
              latest_flag="--latest"
            fi

            gh release create "$tag_name" \
              --title "$tag_name" \
              --notes "See: https://github.com/astral-sh/ruff/releases/tag/${tag_name#v}" \
              --verify-tag \
              "$latest_flag"
          done <<< "$NEW_TAGS"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAGS: ${{ steps.check_unpushed.outputs.tags }}
